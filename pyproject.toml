[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kallyel"
version = "0.1.0"
description = "Kallyel: análise de logs para detecção de ataques web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
    "jinja2>=3.1",
    "tomli>=2; python_version < '3.11'",  # tomllib só existe a partir do Python 3.11
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "tomli>=2",  # mypy checa o ramo do Python 3.10
]

[project.scripts]
kallyel = "kallyel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kallyel = ["py.typed", "rules/builtin/*.yaml", "report/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
# Mensagens ao usuário são strings longas que o formatador não quebra.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # texto em português usa × e →

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# O teste de 1 milhão de linhas fica de fora por padrão: rode com  pytest -m perf
addopts = "-ra -m 'not perf'"
markers = ["perf: testes de desempenho pesados (1 milhão de linhas); rode com -m perf"]

[tool.coverage.run]
source = ["kallyel"]
